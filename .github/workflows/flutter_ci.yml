name: Flutter CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          cache: true
      - name: Show toolchain
        run: flutter --version
      - name: Dependencies
        run: flutter pub get
      - name: Formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Static analysis
        run: flutter analyze
      - name: Tests
        run: flutter test
      - name: Android release build (unsigned validation only)
        run: flutter build apk --release -PunsignedSmokeBuild=true
      - name: Android bundle (unsigned validation only)
        run: flutter build appbundle --release -PunsignedSmokeBuild=true
