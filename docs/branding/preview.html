<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Pass The Phone branding preview</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:36px;font:16px system-ui;background:#eeeaf5;color:#241b35}h1{font-size:26px}main{display:flex;gap:28px;flex-wrap:wrap}.card{padding:24px;background:white;border-radius:24px;text-align:center}.icon{position:relative;width:216px;height:216px;overflow:hidden;margin:24px auto;background:#2d037f}.circle{border-radius:50%}.squircle{border-radius:27%}.layer{position:absolute;width:324px;height:324px;left:-54px;top:-54px}.foreground{padding:64.8px}.legacy .layer{width:216px;height:216px;left:0;top:0}.legacy .foreground{padding:15.12px}.phone{width:260px;height:410px;display:grid;place-items:center;background:#2d037f;border-radius:24px}.splash{width:288px;height:288px;padding:57.6px}.caption{max-width:900px;line-height:1.6}.dark{background:#17131e;color:#fff}
</style>
<h1>Pass The Phone — owner-supplied branding</h1>
<p class="caption">Static layout preview. Launcher motion, system scaling and actual device appearance require device review. Source edge residue is preserved.</p>
<main>
<section class="card"><h2>Circle launcher</h2><div class="icon circle"><img class="layer" src="../../assets/branding/adaptive_background2.png"><img class="layer foreground" src="../../assets/branding/adaptive_foreground.png"></div></section>
<section class="card"><h2>Rounded launcher</h2><div class="icon squircle"><img class="layer" src="../../assets/branding/adaptive_background2.png"><img class="layer foreground" src="../../assets/branding/adaptive_foreground.png"></div></section>
<section class="card"><h2>Android 24/25</h2><div class="icon legacy"><img class="layer" src="../../assets/branding/adaptive_background2.png"><img class="layer foreground" src="../../assets/branding/adaptive_foreground.png"></div></section>
<section class="card"><h2>Splash / light mode</h2><div class="phone"><img class="splash" src="../../assets/branding/splash_logo.png"></div></section>
<section class="card dark"><h2>Splash / dark mode</h2><div class="phone"><img class="splash" src="../../assets/branding/splash_logo.png"></div></section>
</main>
</html>
